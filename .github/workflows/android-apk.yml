name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # First run only: create package.json + lockfile, then commit them back
      # so later builds (and your computer) use the exact same versions.
      - name: Bootstrap Expo project (first run only)
        id: bootstrap
        run: |
          if [ -f package.json ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            bash scripts/ci-run.sh bootstrap bash scripts/bootstrap.sh
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated package files
        if: steps.bootstrap.outputs.created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json assets
          git commit -m "Add package.json and lockfile generated by bootstrap"
          git push

      - name: Install dependencies
        if: steps.bootstrap.outputs.created == 'false'
        run: bash scripts/ci-run.sh npm-ci npm ci

      # Fast check (~1 min) that the JavaScript bundles before the long native build.
      - name: Bundle JavaScript
        run: bash scripts/ci-run.sh bundle npx expo export --platform android --output-dir /tmp/bundle-check

      - name: Generate native Android project
        run: bash scripts/ci-run.sh prebuild npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        # arm64 only: every Android phone from the last ~8 years, and a much faster build.
        run: bash ../scripts/ci-run.sh gradle ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Publish APK as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          TAG="v${VERSION}-build.${{ github.run_number }}"
          cp android/app/build/outputs/apk/release/app-release.apk "fpv-build-planner-${TAG}.apk"
          gh release create "$TAG" "fpv-build-planner-${TAG}.apk" \
            --title "FPV Build Planner ${TAG}" \
            --notes "Built from ${GITHUB_SHA::7}. Open this page on your phone and tap the .apk to install." \
            --latest
